# Cloudflare Pages config for Next.js
name = "auratreats"
compatibility_date = "2026-10-25"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npx @cloudflare/next-on-pages@1"
pages_build_output_dir = ".vercel/output/static"

[vars]
NEXT_PUBLIC_SITE_URL = "https://spa.auraretreat.co.za"

[env.production.vars]
AURA_API_URL = "https://spa.auraretreat.co.za/wp-json/aura/v1"
