# Cloudflare Pages config for Next.js
# This project MUST be deployed as a Pages project (not Workers service)
# because next-on-pages generates _worker.js/ with dynamic import() that
# only works in the Pages runtime.
name = "auratreats"
compatibility_date = "2026-10-25"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npx @cloudflare/next-on-pages@1"
pages_build_output_dir = ".vercel/output/static"

[build.environment]
NEXT_PUBLIC_SENTRY_DSN = "https://33705ef97e79dbbcc9d2e3a36b2edb1d@o4512234868178944.ingest.us.sentry.io/4512234903437312"

[vars]
NEXT_PUBLIC_SITE_URL = "https://spa.auraretreat.co.za"
AURA_API_URL = "https://spa.auraretreat.co.za/wp-json/aura/v1"

[env.production.vars]
AURA_API_URL = "https://spa.auraretreat.co.za/wp-json/aura/v1"
