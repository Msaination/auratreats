# Cloudflare Pages config for Next.js
#
# IMPORTANT: Update Cloudflare dashboard settings:
#   Build command: npx @cloudflare/next-on-pages@1 && node scripts/post-build.js
#   Deploy command: npx wrangler pages deploy .vercel/output/static --project-name=auratreats
#   Root directory: /frontend
#   (NOT "npx wrangler deploy" — that's for Workers services)
#
# The scripts/post-build.js no-op runs without error. wrangler pages deploy
# natively supports the _worker.js/ directory that next-on-pages generates.
#
# ALSO: Ensure CLOUDFLARE_API_TOKEN has Pages:Edit permission.
# Set as env var in dashboard (Settings → Environment variables), not in wrangler.toml.
name = "auratreats"
compatibility_date = "2026-10-25"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npx @cloudflare/next-on-pages@1"
pages_build_output_dir = ".vercel/output/static"

[build.environment]
NEXT_PUBLIC_SENTRY_DSN = "https://33705ef97e79dbbcc9d2e3a36b2edb1d@o4512234868178944.ingest.us.sentry.io/4512234903437312"
WORDPRESS_GRAPHQL_ENDPOINT = "https://spa.auraretreat.co.za/graphql"
AURA_API_URL = "https://spa.auraretreat.co.za/wp-json/aura/v1"

[vars]
NEXT_PUBLIC_SITE_URL = "https://spa.auraretreat.co.za"
AURA_API_URL = "https://spa.auraretreat.co.za/wp-json/aura/v1"
# NOTE: CLOUDFLARE_API_TOKEN must be set as a secret/environment variable
# in the Cloudflare dashboard (Settings → Environment variables), NOT here.
# DO NOT commit API tokens to wrangler.toml or source control.

